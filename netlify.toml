[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# The app is a static export (next.config.ts sets output: "export").
# Progress save/restore uses Netlify Functions + Blobs keyed by a safe word.

# Keep function routes reachable — do not catch-all them into 404.html.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
